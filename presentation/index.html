/* The HTTP/2 envelope: an inspectable example, before the C# snippet. */
.frame-model{margin:0 0 18px;padding:16px;border:1px solid var(--line);border-radius:11px;background:#fbfcf6}
.frame-model h2{font-size:16px;letter-spacing:-.35px;line-height:1.4;margin:0 0 4px}
.frame-hint{font-size:11px;line-height:1.6;color:var(--muted);margin:0 0 14px}
.frame-fields{display:grid;grid-template-columns:1.6fr 1fr 1fr 2fr;gap:5px}
.frame-field{min-width:0;padding:11px 5px 9px;border:1px solid var(--line);border-radius:7px;background:var(--paper);text-align:center}
.frame-field[aria-pressed="true"]{background:var(--accent);border-color:#87a948}
.frame-field strong{display:block;font-size:10px;font-weight:650;margin-bottom:8px}
.frame-field code{display:block;white-space:nowrap;font:600 11px ui-monospace,monospace;letter-spacing:-.3px}
.frame-field small{display:block;color:var(--muted);font-size:9px;margin-top:7px}
.frame-explanation{margin:12px 0;font-size:12px;line-height:1.65;min-height:4.95em}
.frame-payload{display:flex;align-items:center;gap:9px;border-top:1px dashed var(--line);padding-top:12px;font-size:11px;color:var(--muted)}
.frame-payload strong{margin-left:auto;font:600 20px ui-monospace,monospace;color:var(--ink);letter-spacing:3px}
.frame-total{margin-top:10px;font:600 10px ui-monospace,monospace;color:var(--muted)}
@media(max-width:1050px){.frame-fields{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:760px){.frame-model{padding:14px}.frame-fields{grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}.frame-field{padding:10px 8px}.frame-field strong{font-size:11px}.frame-field code{font-size:13px}.frame-field small{font-size:10px}.frame-explanation{min-height:5em}.frame-model h2{font-size:15px}}
.channel-model{border:1px solid var(--line);border-radius:10px;background:#fbfcf6;padding:15px;margin-bottom:16px}.channel-path{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:9px;align-items:center;text-align:center}.channel-path strong{font-size:12px}.channel-path span{font-size:12px;font-weight:650;background:var(--accent);padding:9px 11px;border-radius:6px}.channel-model p{font-size:11px;line-height:1.6;color:var(--muted);margin:12px 0 0;text-align:center}

.traffic-field strong{font-size:14px}.traffic-field code{font:12px/1.6 ui-monospace,monospace;overflow-wrap:anywhere;white-space:pre-wrap}.traffic-field small{font-size:12px;line-height:1.4}
.traffic-field:hover{filter:brightness(.96)}.traffic-field[aria-pressed="true"]{border-color:currentColor;box-shadow:inset 0 0 0 1px currentColor}

 <div class="traffic-controls"><div class="switches" role="group" aria-label="Спосіб передавання"><button type="button" data-traffic-mode="plain" aria-pressed="false">Без SSL</button><button type="button" data-traffic-mode="ssl" aria-pressed="true">Із SSL3</button></div><button type="button" class="traffic-reveal" aria-pressed="false" aria-controls="traffic-drawing">Показати вміст на сервері</button></div>
 <div id="traffic-drawing"></div><div class="traffic-detail" id="traffic-detail" role="status" aria-live="polite" aria-atomic="true"></div>
 <p class="traffic-boundaries">У режимі SSL показано дані після handshake: SSL3 + 3DES-CBC + SHA-1 MAC, без стиснення. Тут запит умістився в один SSL-запис. Загалом TCP може розбити запис між сегментами або передати кілька записів разом; межі HTTP, SSL і TCP не зобов’язані збігатися.</p></div>`;
}
function trafficField(id,title,body,small='',detail='traffic-detail'){
 return '<button type="button" class="traffic-field" data-traffic-field="'+id+'" aria-pressed="false" aria-controls="'+detail+'"><strong>'+esc(title)+'</strong><code>'+esc(body)+'</code>'+(small?'<small>'+esc(small)+'</small>':'')+'</button>';
}
function renderTraffic(model){
 const ssl=model.dataset.ssl==='true', revealed=model.dataset.revealed==='true';
 model.closest('.slide').querySelector('.change').textContent=ssl?'HTTP-заголовки — усередині шифротексту. Заголовок SSL-запису — зовні.':'Без SSL рядок запиту, HTTP-заголовки й тіло передаються відкрито.';
 const http='<div class="traffic-http">'+trafficField('request','Рядок запиту','POST / HTTP/1.0\\r\\n','16 байтів')+trafficField('headers','HTTP-заголовок + порожній рядок','Content-Length: 3\\r\\n\\r\\n','22 байти')+trafficField('body','Тіло','x=1','3 байти')+'</div>';
 const down='<svg viewBox="0 0 20 22" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M10 1v18m-6-6 6 6 6-6"/></svg>';
 const lock='<svg viewBox="0 0 30 36" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="4" y="15" width="22" height="18" rx="3"/><path d="M9 15V9a6 6 0 0 1 12 0v6m-6 8v4"/></svg>';
 const cipher=revealed?'<div class="traffic-decoded"><p class="traffic-decoded-label">Лише на кінцевій стороні після розшифрування.<br>У мережі всі ці 64 байти зашифровані разом.</p><div class="traffic-decoded-parts">'+trafficField('http','Увесь HTTP','16 + 22 + 3','41 байт')+trafficField('mac','MAC','SHA-1','20 байтів')+trafficField('padding','Доповнення','02 02 02','3 байти')+'</div></div>':'<div class="traffic-cipher"><button type="button" data-traffic-field="cipher" aria-pressed="false" aria-controls="traffic-detail">'+lock+'<span><strong>Шифротекст · 64 байти</strong><small>HTTP + MAC + доповнення<br>Вміст прихований від спостерігача</small></span></button></div>';
 const payload=ssl?'<div class="traffic-record-title">Дані TCP: один SSL-запис · 69 байтів</div><div class="traffic-record-parts">'+trafficField('record','Заголовок SSL','17 03 00 00 40','Відкрито · 5 байтів')+cipher+'</div>':'<div class="traffic-record-title">Дані TCP: відкритий HTTP · 41 байт</div>'+http;
 model.querySelector('#traffic-drawing').innerHTML='<div class="traffic-caption"><strong>У клієнта до передавання · HTTP, 41 байт</strong><span>\\r\\n = два байти кінця рядка</span></div>'+http+'<div class="traffic-transform">'+down+'<span>'+(ssl?'Додати MAC і доповнення → зашифрувати 3DES-CBC':'Передати ті самі байти в TCP без шифрування')+'</span></div><div class="traffic-caption"><strong>'+(revealed&&ssl?'Розбір на сервері з ключем':'У мережі · що може прочитати спостерігач')+'</strong><span>Порядок полів; розміри блоків на схемі умовні</span></div><div class="traffic-network">'+trafficField('ip','IP','Адреси','Відкрито')+trafficField('tcp','TCP','Порти','Відкрито')+'<div class="traffic-record">'+payload+'</div></div>';
 model.querySelectorAll('[data-traffic-mode]').forEach(b=>b.setAttribute('aria-pressed',String((b.dataset.trafficMode==='ssl')===ssl)));
 const reveal=model.querySelector('.traffic-reveal');reveal.disabled=!ssl;reveal.setAttribute('aria-pressed',String(ssl&&revealed));reveal.textContent=!ssl?'HTTP уже відкритий':revealed?'Повернути вигляд у мережі':'Показати вміст на сервері';
 describeTraffic(model,ssl?(revealed?'http':'cipher'):'http');
}
function describeTraffic(model,id){
 const ssl=model.dataset.ssl==='true';
 const descriptions={
 ip:['IP залишається відкритим','SSL не приховує IP-адреси клієнта й сервера: вони потрібні для доставки пакетів.'],
 tcp:['TCP залишається відкритим','Порти, номери послідовності та інші поля заголовка TCP не шифруються SSL. Спостерігач також бачить розміри й час передавання.'],
 record:['Заголовок SSL теж відкритий','17 у hex = тип 23, Application Data; 03 00 = SSL 3.0; 00 40 = 64 байти шифротексту після заголовка. Ці 5 службових байтів не є HTTP-заголовками.'],
 cipher:['Одна межа шифрування для всього HTTP','41 байт HTTP + 20 байтів MAC + 3 байти доповнення = 64 байти шифротексту. Натисни «Показати вміст на сервері», щоб побачити склад. Спостерігач без ключа цього вмісту не бачить.'],
 http:[ssl?'HTTP повністю всередині':'Увесь HTTP видно відкрито',ssl?'Метод, шлях, версія HTTP, заголовки та тіло шифруються разом. Після розшифрування сервер перевіряє MAC і передає застосунку початковий HTTP без MAC і доповнення.':'Без SSL усі 41 байт HTTP читаються прямо в TCP-потоці. Немає ні заголовка SSL-запису, ні SSL MAC, ні CBC-доповнення.'],
 request:['Рядок запиту · 16 байтів',ssl?'POST, шлях / і HTTP/1.0 також потрапляють усередину шифротексту. Верхній ряд показує початковий текст у клієнта, а не відкритий текст у мережі.':'Спостерігач може прочитати метод POST, шлях / та версію HTTP/1.0. Кінець рядка додає два байти CR і LF.'],
 headers:['HTTP-заголовки теж є даними',ssl?'Content-Length: 3 разом із кінцем рядка та порожнім рядком займає 22 байти. SSL шифрує ці байти так само, як тіло. Видимою лишається довжина SSL-запису, а не цей HTTP-заголовок.':'Content-Length: 3 видно відкрито. Порожній рядок відокремлює HTTP-заголовки від тіла; він також передається в TCP.'],
 body:['Тіло · 3 байти',ssl?'x=1 — навчальний приклад тіла запиту. У мережі ці байти зашифровані разом із рядком запиту та HTTP-заголовками.':'x=1 видно відкрито. Так само без SSL було б видно пароль чи інші дані у тілі запиту.'],
 mac:['MAC також шифрується','20-байтовий код перевірки обчислюють з окремим секретом до шифрування. Його додають до HTTP, а потім шифрують разом із ним.'],
 padding:['Доповнення до блоку 3DES','41 + 20 = 61 байт. До кратного 8 бракує трьох: демо додає 02 02 02. Останній байт 02 вказує, що перед ним є ще 2 байти доповнення. Після розшифрування їх прибирають.']
 };
 const [title,body]=descriptions[id];model.querySelector('#traffic-detail').innerHTML='<h2>'+esc(title)+'</h2><p>'+esc(body)+'</p>';
 model.querySelectorAll('[data-traffic-field]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.trafficField===id)));
}

$('#deck').innerHTML=slides.map((s,i)=>{
 const category=/^(SSL|TLS|HTTPS)/.test(s.chapter)?'tls':/^(QUIC|HTTP\/3)/.test(s.chapter)?'quic':'';
 const source='chronological';
 const links=(s.file?'<a href="'+repo+'/blob/'+source+'/'+(s.sourceFile||s.file)+'" target="_blank" rel="noopener">Код</a>':'')+(s.step?'<a href="'+repo+'/tree/'+source+'/'+s.step+'" target="_blank" rel="noopener">Етап '+esc(s.step.split('_')[0])+'</a>':'')+(s.rfc?'<a href="'+refs[s.rfc][1]+'" target="_blank" rel="noopener">'+esc(refs[s.rfc][0])+'</a>':'');
 const extraLinks=(s.extraRefs||[]).map(id=>'<a href="'+refs[id][1]+'" target="_blank" rel="noopener">'+esc(refs[id][0])+'</a>').join('');
 const beats=s.beats?'<div class="story-beats">'+s.beats.map(b=>'<div class="story-beat"><h2>'+esc(b.title)+'</h2><p>'+esc(b.text)+'</p></div>').join('')+'</div>':'';
 const explain=s.explain?'<dl class="code-explanation">'+s.explain.map(([term,meaning])=>'<div><dt>'+esc(term)+'</dt><dd>'+esc(meaning)+'</dd></div>').join('')+'</dl>':'';
 const keyTable=s.keyRows?'<table class="key-table"><caption>Позиції у block · нумерація з нуля</caption><thead><tr><th scope="col">Клієнт / сервер</th><th scope="col">Довжини</th><th scope="col">Призначення</th></tr></thead><tbody>'+s.keyRows.map(row=>'<tr>'+row.map(cell=>'<td>'+esc(cell)+'</td>').join('')+'</tr>').join('')+'</tbody></table>':'';
 const client=s.client?'<details class="wire"><summary>Клієнт у браузері · JavaScript</summary>'+codeCard(s.client,'Браузер','JavaScript','ПРИКЛАД · підключення до відповідного endpoint')+'</details>':'';
 const wire=s.wire?'<details class="wire"><summary>На дроті / схема</summary><pre>'+esc(s.wire)+'</pre></details>':'';
 const run=s.command?'<details class="wire"><summary>Команда для показу</summary><pre><code>'+esc(s.command)+'</code></pre></details>':'';
 const first=s.full?'<details class="wire"><summary>Повний HTTP/0.9-сервер · 22 рядки</summary>'+codeCard(full,'Program.cs','C#','ПОВНИЙ ФАЙЛ · 01_1991_HTTP0.9_GET')+'</details>':'';
 const route=s.hero?'<div class="route" aria-label="HTTP 0.9, HTTP 1.x, HTTP 2, HTTP 3"><span>0.9</span><i>→</i><span>1.x</span><i>→</i><span>2</span><i>→</i><span>3</span></div><div class="hero-stats"><span><strong>22</strong>рядки першого сервера</span><span><strong>3</strong>мережеві класи .NET</span></div>':'';
 const final=s.final?'<div class="final-links"><a href="'+repo+'/tree/chronological" target="_blank" rel="noopener">Відкрити репозиторій ↗</a><a href="'+repo+'/pull/1" target="_blank" rel="noopener">PR для перегляду ↗</a></div>':'';
 return '<section class="slide '+category+(['ssl-traffic','host'].includes(s.interactive)?' traffic-slide':'')+(s.walkthrough?' ssl-walkthrough':'')+(!s.code?' narrative':'')+(s.hero?' hero':'')+'" id="'+s.id+'" data-index="'+i+'" aria-label="Слайд '+(i+1)+' з '+slides.length+'" hidden>'+(!s.walkthrough?'<div class="eyebrow"><span class="year">'+esc(s.year)+'</span><span class="dot"></span><span>'+esc(s.chapter)+'</span></div>':'')+'<div class="layout"><div class="story"><h1 tabindex="-1">'+esc(s.title).replace(/\n/g,'<br>')+'</h1><p class="lead">'+esc(s.why)+'</p><div class="change"><span class="change-label">'+esc(s.changeLabel||'Що змінюємо')+'</span>'+esc(s.change)+'</div>'+route+final+'</div><div class="workbench">'+(s.interactive==='ssl-traffic'?sslTrafficModel():s.interactive==='host'?hostPrivacyModel():s.interactive==='frame'?frameModel():'')+(s.channel?channelModel(s.channel):'')+beats+(s.code?(s.interactive==='host'?'<details class="wire"><summary>Код демо · перевірка Host</summary>':'')+codeCard(s.code,s.codeTitle||s.file,s.language||'C#',s.codeCaption)+(s.interactive==='host'?'</details>':''):'')+keyTable+explain+'<div class="sources">'+links+extraLinks+'</div>'+client+(s.interactive==='host'?hostModel():s.interactive==='loss'?lossModel():'')+wire+run+first+(s.note?'<p class="note">'+esc(s.note)+'</p>':'')+'</div></div><div class="slide-base"><span class="section-color"></span><span>HTTP EVOLUTION</span><span class="rule"></span><span>'+String(i+1).padStart(2,'0')+' / '+slides.length+'</span></div></section>';
}).join('');
let group='';$('.topics').innerHTML=slides.map((s,i)=>{let label='';const g=s.chapter;if(g!==group){group=g;label='<div class="topics-group">'+esc(g)+'</div>';}return label+'<button type="button" class="topic" data-go="'+i+'"><span>'+String(i+1).padStart(2,'0')+'</span><span>'+esc(s.year)+'</span><strong>'+esc(s.title.replace(/\n/g,' '))+'</strong></button>';}).join('');
let index=-1;
function hashIndex(){let id;try{id=decodeURIComponent(location.hash.slice(1));}catch{return 0;}const n=slides.findIndex(s=>s.id===id);return n>=0?n:0;}
function show(n,focus=false){
 n=Math.max(0,Math.min(slides.length-1,n));
 if(index===n)return;
 $$('.slide').forEach((el,i)=>{el.hidden=i!==n;el.classList.toggle('current',i===n);});index=n;
 $('#current-num').textContent=String(n+1).padStart(2,'0');$('#total-num').textContent=slides.length;$('#chapter-name').textContent=slides[n].chapter;
 $('#prev').disabled=n===0;$('#next').disabled=n===slides.length-1;$('#next span').textContent=n===slides.length-1?'Кінець':'Далі';
 $('#progress').style.width=((n+1)/slides.length*100)+'%';document.title=slides[n].title.replace(/\n/g,' ')+' — HTTP Evolution';
 $$('.topic').forEach((el,i)=>{if(i===n)el.setAttribute('aria-current','step');else el.removeAttribute('aria-current');});
 try{localStorage.setItem('http-evolution-slide',slides[n].id);}catch{}
 window.scrollTo(0,0);if(focus)$('#'+slides[n].id+' h1').focus({preventScroll:true});
}
function go(n){n=Math.max(0,Math.min(slides.length-1,n));if(n===index)return;history.pushState(null,'','#'+slides[n].id);show(n,true);}
let initial=hashIndex();if(!location.hash){try{const saved=localStorage.getItem('http-evolution-slide');const n=slides.findIndex(s=>s.id===saved);if(n>=0)initial=n;}catch{}history.replaceState(null,'','#'+slides[initial].id);}show(initial);
window.addEventListener('popstate',()=>show(hashIndex(),true));window.addEventListener('hashchange',()=>show(hashIndex(),true));
$('#prev').addEventListener('click',()=>go(index-1));$('#next').addEventListener('click',()=>go(index+1));
const dialog=$('#contents');let menuOpener=null;
function openMenu(event){menuOpener=event.currentTarget;dialog.showModal();requestAnimationFrame(()=>$('.topic[aria-current="step"]')?.scrollIntoView({block:'center'}));}
$('#open-menu').addEventListener('click',openMenu);$('#counter').addEventListener('click',openMenu);$('.close-menu').addEventListener('click',()=>dialog.close());
dialog.addEventListener('close',()=>menuOpener?.focus({preventScroll:true}));dialog.addEventListener('click',e=>{if(e.target===dialog){const r=dialog.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)dialog.close();}});
$$('.topic').forEach(el=>el.addEventListener('click',()=>{dialog.close();go(Number(el.dataset.go));}));
document.addEventListener('keydown',e=>{if(dialog.open||e.altKey||e.ctrlKey||e.metaKey||e.target.closest('pre,button,a,input,summary'))return;const changes={ArrowRight:1,PageDown:1,ArrowLeft:-1,PageUp:-1};if(changes[e.key]){e.preventDefault();go(index+changes[e.key]);}else if(e.key==='Home'){e.preventDefault();go(0);}else if(e.key==='End'){e.preventDefault();go(slides.length-1);}});
let touch=null;$('#deck').addEventListener('pointerdown',e=>{if(e.pointerType!=='touch'||!e.isPrimary||e.target.closest('pre,button,a,summary,input,details'))return;touch={x:e.clientX,y:e.clientY,t:performance.now()};});
$('#deck').addEventListener('pointerup',e=>{if(!touch)return;const dx=e.clientX-touch.x,dy=e.clientY-touch.y,dt=performance.now()-touch.t;touch=null;if(e.pointerType==='touch'&&Math.abs(dx)>65&&Math.abs(dy)<40&&dt<650&&!getSelection()?.toString())go(index+(dx<0?1:-1));});$('#deck').addEventListener('pointercancel',()=>touch=null);
let toastTimer;function toast(message){$('#toast').textContent=message;$('#toast').classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').classList.remove('show'),2000);}
$$('.copy').forEach(button=>button.addEventListener('click',async()=>{const code=button.closest('.code-card').querySelector('code').textContent;try{await navigator.clipboard.writeText(code);toast('Код скопійовано');}catch{toast('Виділи код і скопіюй вручну');}}));


$$('.host-privacy').forEach(model=>{
 renderHostPrivacy(model);

 });
});

$$('.traffic-model').forEach(model=>{
 renderTraffic(model);
 model.addEventListener('click',event=>{
  const mode=event.target.closest('[data-traffic-mode]'),reveal=event.target.closest('.traffic-reveal'),field=event.target.closest('[data-traffic-field]');
  if(mode){model.dataset.ssl=String(mode.dataset.trafficMode==='ssl');model.dataset.revealed='false';renderTraffic(model);}

  else if(field)describeTraffic(model,field.dataset.trafficField);
 });
});
