<script>
'use strict';
const {slides,refs,full}=JSON.parse(document.getElementById('deck-data').textContent);
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];

const repo='https://github.com/podkolzzzin/HttpEvolution';

function highlight(code){
 const rx=/(\/\/[^\n]*|"(?:\\.|[^"\\])*"|'(?:\\.|[^'\\])*'|\b(?:using|var|if|else|new|return|for|foreach|while|continue|break|true|false|null|int|byte|bool|throw|await|static|sealed|class|public|void|in|is|not|or|stackalloc)\b|\b(?:0x[\da-fA-F]+|\d+)\b)/g;
 let out='',last=0;
 for(const m of code.matchAll(rx)){out+=esc(code.slice(last,m.index));const t=m[0];const cls=t.startsWith('//')?'comment':/^["']/.test(t)?'str':/^\d/.test(t)?'num':'kw';out+='<span class="'+cls+'">'+esc(t)+'</span>';last=m.index+t.length;}
 return out+esc(code.slice(last));
}
function codeCard(code,file,lang='C#',caption='ФРАГМЕНТ · деталі й перевірки скорочено'){

}
