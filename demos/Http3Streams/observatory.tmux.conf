# This configuration lives on the demo's own tmux socket.
set -g status-position top
set -g status-style 'bg=#142331,fg=#d8e5ed'
set -g status-left-length 40
set -g status-left '#[fg=#79dbc3,bold]  ☾  Нічна обсерваторія  '
set -g status-right-length 50
set -g status-right '#[bold,fg=#79dbc3] r #[nobold,fg=#d8e5ed]повторити   #[bold,fg=#ffbc7d]q #[nobold,fg=#d8e5ed]вийти  '
set -g window-status-current-format ''
set -g window-style 'bg=#101923,fg=#e1eaf1'
set -g window-active-style 'bg=#101923,fg=#e1eaf1'
set -g pane-border-status top
set -g pane-border-style 'fg=#52768a'
set -g pane-active-border-style 'fg=#6fbbad'
set -g pane-border-format ' #[bold,fg=#a5ded7]#{pane_title}#{?pane_dead_status, #[fg=#ffbc7d]· код #{pane_dead_status},} #[default]'
set -g remain-on-exit on
set -g remain-on-exit-format ''
bind -n r respawn-pane -k -t observatory:0.1 \; respawn-pane -k -t observatory:0.2
bind -n q kill-session -t observatory
